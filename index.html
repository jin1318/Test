<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파일 탐색기 UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons (Windows 10 스타일 아이콘) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 h-screen w-screen flex items-center justify-center p-2 font-sans select-none">

  <!-- 탐색기 전체 창 -->
  <div class="w-full h-full max-w-6xl max-h-[800px] bg-white border border-gray-400 shadow-2xl flex flex-col rounded-sm overflow-hidden text-xs">

    <!-- 1. 타이틀바 (Window Titlebar) -->
    <div class="bg-white px-2 py-1 flex justify-between items-center border-b border-gray-200">
      <div class="flex items-center gap-2 text-gray-700">
        <i data-lucide="folder" class="w-4 h-4 text-blue-500 fill-blue-500"></i>
        <span class="text-gray-500">|</span>
        <span class="text-xs text-gray-800">파일 탐색기</span>
      </div>
      <!-- 창 제어 버튼 -->
      <div class="flex items-center">
        <button class="px-3 py-1 hover:bg-gray-200 text-gray-600">─</button>
        <button class="px-3 py-1 hover:bg-gray-200 text-gray-600">☐</button>
        <button class="px-3 py-1 hover:bg-red-600 hover:text-white text-gray-600">✕</button>
      </div>
    </div>

    <!-- 2. 리본 메뉴 & 상단 메뉴 (Tabs & Action Bar) -->
    <div class="border-b border-gray-300">
      <!-- 탭 바 -->
      <div class="flex text-xs bg-white border-b border-gray-200">
        <button class="px-3 py-1 bg-blue-600 text-white font-medium">파일</button>
        <button class="px-3 py-1 bg-white hover:bg-gray-100 text-gray-700 border-b-2 border-blue-600">홈</button>
        <button class="px-3 py-1 bg-white hover:bg-gray-100 text-gray-700">공유</button>
        <button class="px-3 py-1 bg-white hover:bg-gray-100 text-gray-700">보기</button>
      </div>

      <!-- 주소창 및 검색창 (Navigation Bar) -->
      <div class="p-1.5 bg-white flex items-center gap-2 border-b border-gray-200">
        <!-- 뒤로/앞으로/위로 -->
        <div class="flex items-center gap-1 text-gray-400">
          <button class="p-1 hover:bg-gray-100 rounded hover:text-gray-700"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i></button>
          <button class="p-1 hover:bg-gray-100 rounded hover:text-gray-700"><i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></button>
          <button class="p-1 hover:bg-gray-100 rounded hover:text-gray-700"><i data-lucide="arrow-up" class="w-3.5 h-3.5"></i></button>
        </div>

        <!-- 경로 주소창 -->
        <div class="flex-1 flex items-center bg-white border border-gray-300 px-2 py-1 gap-1 focus-within:border-blue-500">
          <i data-lucide="star" class="w-3.5 h-3.5 text-blue-500 fill-blue-500"></i>
          <span class="text-gray-600">즐겨찾기</span>
          <i data-lucide="chevron-right" class="w-3 h-3 text-gray-400"></i>
          <div class="flex-1"></div>
          <button class="hover:text-black text-gray-400"><i data-lucide="rotate-cw" class="w-3 h-3"></i></button>
        </div>

        <!-- 검색창 -->
        <div class="w-56 flex items-center bg-white border border-gray-300 px-2 py-1 gap-1 focus-within:border-blue-500">
          <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400"></i>
          <input type="text" placeholder="즐겨찾기 검색" class="w-full outline-none text-xs text-gray-700 placeholder-gray-400">
        </div>
      </div>
    </div>

    <!-- 3. 메인 콘텐츠 (Sidebar + Folder Grid) -->
    <div class="flex-1 flex overflow-hidden">

      <!-- 좌측 사이드바 (Navigation Pane) -->
      <aside class="w-48 bg-slate-50 border-r border-gray-200 p-2 overflow-y-auto shrink-0 text-gray-700">
        <!-- 즐겨찾기 그룹 -->
        <div class="mb-3">
          <div class="flex items-center gap-1 px-1 py-1 bg-gray-200 font-medium text-gray-800">
            <i data-lucide="star" class="w-3.5 h-3.5 text-blue-500 fill-blue-500"></i>
            <span>즐겨찾기</span>
          </div>
          <div class="ml-3 mt-1 space-y-0.5">
            <a href="#" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="monitor" class="w-3.5 h-3.5 text-blue-500"></i> 바탕 화면</span>
              <i data-lucide="pin" class="w-3 h-3 text-gray-400 rotate-45"></i>
            </a>
            <a href="#" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="arrow-down-to-line" class="w-3.5 h-3.5 text-blue-500"></i> 다운로드</span>
              <i data-lucide="pin" class="w-3 h-3 text-gray-400 rotate-45"></i>
            </a>
            <a href="#" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="file-text" class="w-3.5 h-3.5 text-blue-500"></i> 문서</span>
              <i data-lucide="pin" class="w-3 h-3 text-gray-400 rotate-45"></i>
            </a>
            <a href="#" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="image" class="w-3.5 h-3.5 text-blue-500"></i> 사진</span>
              <i data-lucide="pin" class="w-3 h-3 text-gray-400 rotate-45"></i>
            </a>
            <a href="#" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="film" class="w-3.5 h-3.5 text-blue-500"></i> 동영상</span>
              <i data-lucide="pin" class="w-3 h-3 text-gray-400 rotate-45"></i>
            </a>
            <a href="#" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="music" class="w-3.5 h-3.5 text-blue-500"></i> 음악</span>
            </a>
          </div>
        </div>

        <!-- 내 PC / 네트워크 -->
        <div class="space-y-1">
          <a href="#" class="flex items-center gap-2 px-1.5 py-1 hover:bg-gray-200 rounded">
            <i data-lucide="hard-drive" class="w-3.5 h-3.5 text-blue-500"></i> 내 PC
          </a>
          <a href="#" class="flex items-center gap-2 px-1.5 py-1 hover:bg-gray-200 rounded">
            <i data-lucide="network" class="w-3.5 h-3.5 text-blue-500"></i> 네트워크
          </a>
        </div>
      </aside>

      <!-- 우측 메인 영역 (Main Content) -->
      <main class="flex-1 bg-white p-4 overflow-y-auto flex flex-col gap-6">

        <!-- 섹션 1: 자주 사용하는 폴더 -->
        <div>
          <div class="flex items-center gap-1 border-b border-gray-200 pb-1 mb-3 text-gray-700 font-medium">
            <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
            <span>자주 사용하는 폴더 (6)</span>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            
            <!-- 폴더 아이템 1 -->
            <div class="flex items-start gap-3 p-2 rounded hover:bg-blue-50 hover:border-blue-200 border border-transparent cursor-pointer group">
              <div class="relative">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400 fill-yellow-400"></i>
                <i data-lucide="monitor" class="w-4 h-4 text-blue-500 absolute bottom-1 right-1"></i>
              </div>
              <div class="flex flex-col">
                <span class="font-medium text-gray-800 group-hover:text-blue-600">바탕 화면</span>
                <span class="text-[10px] text-gray-400 flex items-center gap-0.5">내 PC <i data-lucide="pin" class="w-2.5 h-2.5 rotate-45"></i></span>
              </div>
            </div>

            <!-- 폴더 아이템 2 -->
            <div class="flex items-start gap-3 p-2 rounded hover:bg-blue-50 hover:border-blue-200 border border-transparent cursor-pointer group">
              <div class="relative">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400 fill-yellow-400"></i>
                <i data-lucide="arrow-down" class="w-4 h-4 text-blue-500 absolute bottom-1 right-1"></i>
              </div>
              <div class="flex flex-col">
                <span class="font-medium text-gray-800 group-hover:text-blue-600">다운로드</span>
                <span class="text-[10px] text-gray-400 flex items-center gap-0.5">내 PC <i data-lucide="pin" class="w-2.5 h-2.5 rotate-45"></i></span>
              </div>
            </div>

            <!-- 폴더 아이템 3 -->
            <div class="flex items-start gap-3 p-2 rounded hover:bg-blue-50 hover:border-blue-200 border border-transparent cursor-pointer group">
              <div class="relative">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400 fill-yellow-400"></i>
                <i data-lucide="file-text" class="w-4 h-4 text-blue-500 absolute bottom-1 right-1"></i>
              </div>
              <div class="flex flex-col">
                <span class="font-medium text-gray-800 group-hover:text-blue-600">문서</span>
                <span class="text-[10px] text-gray-400 flex items-center gap-0.5">내 PC <i data-lucide="pin" class="w-2.5 h-2.5 rotate-45"></i></span>
              </div>
            </div>

            <!-- 폴더 아이템 4 -->
            <div class="flex items-start gap-3 p-2 rounded hover:bg-blue-50 hover:border-blue-200 border border-transparent cursor-pointer group">
              <div class="relative">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400 fill-yellow-400"></i>
                <i data-lucide="image" class="w-4 h-4 text-blue-500 absolute bottom-1 right-1"></i>
              </div>
              <div class="flex flex-col">
                <span class="font-medium text-gray-800 group-hover:text-blue-600">사진</span>
                <span class="text-[10px] text-gray-400 flex items-center gap-0.5">내 PC <i data-lucide="pin" class="w-2.5 h-2.5 rotate-45"></i></span>
              </div>
            </div>

            <!-- 폴더 아이템 5 -->
            <div class="flex items-start gap-3 p-2 rounded hover:bg-blue-50 hover:border-blue-200 border border-transparent cursor-pointer group">
              <div class="relative">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400 fill-yellow-400"></i>
                <i data-lucide="film" class="w-4 h-4 text-blue-500 absolute bottom-1 right-1"></i>
              </div>
              <div class="flex flex-col">
                <span class="font-medium text-gray-800 group-hover:text-blue-600">동영상</span>
                <span class="text-[10px] text-gray-400 flex items-center gap-0.5">내 PC <i data-lucide="pin" class="w-2.5 h-2.5 rotate-45"></i></span>
              </div>
            </div>

            <!-- 폴더 아이템 6 -->
            <div class="flex items-start gap-3 p-2 rounded hover:bg-blue-50 hover:border-blue-200 border border-transparent cursor-pointer group">
              <div class="relative">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400 fill-yellow-400"></i>
                <i data-lucide="music" class="w-4 h-4 text-blue-500 absolute bottom-1 right-1"></i>
              </div>
              <div class="flex flex-col">
                <span class="font-medium text-gray-800 group-hover:text-blue-600">음악</span>
                <span class="text-[10px] text-gray-400 flex items-center gap-0.5">내 PC <i data-lucide="pin" class="w-2.5 h-2.5 rotate-45"></i></span>
              </div>
            </div>

          </div>
        </div>

        <!-- 섹션 2: 최근에 사용한 파일 -->
        <div>
          <div class="flex items-center gap-1 border-b border-gray-200 pb-1 mb-3 text-gray-700 font-medium">
            <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
            <span>최근에 사용한 파일 (0)</span>
          </div>

          <div class="py-8 text-center text-gray-400 text-xs">
            일부 파일을 연 후에 가장 최근에 열어 본 파일이 여기에 표시됩니다.
          </div>
        </div>

      </main>
    </div>

    <!-- 4. 하단 상태 표시줄 (Status Bar) -->
    <div class="bg-slate-50 border-t border-gray-200 px-3 py-1 flex justify-between items-center text-gray-500 text-[11px]">
      <div>6개 항목</div>
      <div class="flex items-center gap-2">
        <button class="p-1 hover:bg-gray-200 rounded text-gray-700"><i data-lucide="layout-grid" class="w-3.5 h-3.5"></i></button>
        <button class="p-1 hover:bg-gray-200 rounded text-gray-400"><i data-lucide="list" class="w-3.5 h-3.5"></i></button>
      </div>
    </div>

  </div>

  <!-- Lucide 아이콘 초기화 -->
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
