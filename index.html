<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나눔가이드 - 파일 탐색기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 h-screen w-screen flex items-center justify-center p-2 font-sans select-none">

  <!-- 탐색기 전체 창 -->
  <div class="w-full h-full max-w-6xl max-h-[800px] bg-white border border-gray-400 shadow-2xl flex flex-col rounded-sm overflow-hidden text-xs">

    <!-- 1. 타이틀바 (Window Titlebar) -->
    <div class="bg-white px-2 py-1 flex justify-between items-center border-b border-gray-200">
      <div class="flex items-center gap-2 text-gray-700">
        <i data-lucide="folder" class="w-4 h-4 text-blue-500 fill-blue-500"></i>
        <span class="text-gray-500">|</span>
        <span class="text-xs text-gray-800">나눔가이드 - 파일 탐색기</span>
      </div>
      <!-- 창 제어 버튼 -->
      <div class="flex items-center">
        <button class="px-3 py-1 hover:bg-gray-200 text-gray-600">─</button>
        <button class="px-3 py-1 hover:bg-gray-200 text-gray-600">☐</button>
        <button class="px-3 py-1 hover:bg-red-600 hover:text-white text-gray-600">✕</button>
      </div>
    </div>

    <!-- 2. 리본 메뉴 & 상단 메뉴 (Tabs & Action Bar) -->
    <div class="border-b border-gray-300">
      <!-- 탭 바 -->
      <div class="flex text-xs bg-white border-b border-gray-200">
        <button class="px-3 py-1 bg-blue-600 text-white font-medium">파일</button>
        <button class="px-3 py-1 bg-white hover:bg-gray-100 text-gray-700 border-b-2 border-blue-600">홈</button>
        <button class="px-3 py-1 bg-white hover:bg-gray-100 text-gray-700">공유</button>
        <button class="px-3 py-1 bg-white hover:bg-gray-100 text-gray-700">보기</button>
      </div>

      <!-- 주소창 및 검색창 (Navigation Bar) -->
      <div class="p-1.5 bg-white flex items-center gap-2 border-b border-gray-200">
        <!-- 뒤로/앞으로/위로 -->
        <div class="flex items-center gap-1 text-gray-400">
          <button class="p-1 hover:bg-gray-100 rounded hover:text-gray-700"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i></button>
          <button class="p-1 hover:bg-gray-100 rounded hover:text-gray-700"><i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></button>
          <button class="p-1 hover:bg-gray-100 rounded hover:text-gray-700"><i data-lucide="arrow-up" class="w-3.5 h-3.5"></i></button>
        </div>

        <!-- 경로 주소창 -->
        <div class="flex-1 flex items-center bg-white border border-gray-300 px-2 py-1 gap-1 focus-within:border-blue-500">
          <i data-lucide="star" class="w-3.5 h-3.5 text-blue-500 fill-blue-500"></i>
          <span class="text-gray-600">즐겨찾기</span>
          <i data-lucide="chevron-right" class="w-3 h-3 text-gray-400"></i>
          <div class="flex-1"></div>
          <button class="hover:text-black text-gray-400"><i data-lucide="rotate-cw" class="w-3 h-3"></i></button>
        </div>

        <!-- 검색창 -->
        <div class="w-56 flex items-center bg-white border border-gray-300 px-2 py-1 gap-1 focus-within:border-blue-500">
          <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400"></i>
          <input type="text" placeholder="나눔가이드 검색" class="w-full outline-none text-xs text-gray-700 placeholder-gray-400">
        </div>
      </div>
    </div>

    <!-- 3. 메인 콘텐츠 (Sidebar + Main View) -->
    <div class="flex-1 flex overflow-hidden">

      <!-- 좌측 사이드바 (Navigation Pane) -->
      <aside class="w-48 bg-slate-50 border-r border-gray-200 p-2 overflow-y-auto shrink-0 text-gray-700">
        <!-- 즐겨찾기 그룹 -->
        <div class="mb-3">
          <div class="flex items-center gap-1 px-1 py-1 bg-gray-200 font-medium text-gray-800">
            <i data-lucide="star" class="w-3.5 h-3.5 text-blue-500 fill-blue-500"></i>
            <span>즐겨찾기</span>
          </div>
          
          <!-- 수정된 7개 메뉴 목록 -->
          <div class="ml-3 mt-1 space-y-0.5">
            <a href="#" onclick="showVolunteerImages(event)" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="layout-grid" class="w-3.5 h-3.5 text-blue-500"></i> 전체보기</span>
              <i data-lucide="pin" class="w-3 h-3 text-gray-400 rotate-45"></i>
            </a>
            <a href="#" onclick="showVolunteerImages(event)" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="hands-holding" class="w-3.5 h-3.5 text-blue-500"></i> 자원봉사</span>
              <i data-lucide="pin" class="w-3 h-3 text-gray-400 rotate-45"></i>
            </a>
            <a href="#" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="monitor" class="w-3.5 h-3.5 text-blue-500"></i> 나눔키오스크</span>
              <i data-lucide="pin" class="w-3 h-3 text-gray-400 rotate-45"></i>
            </a>
            <a href="#" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="heart-handshake" class="w-3.5 h-3.5 text-blue-500"></i> 정기기부</span>
              <i data-lucide="pin" class="w-3 h-3 text-gray-400 rotate-45"></i>
            </a>
            <a href="#" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="droplet" class="w-3.5 h-3.5 text-blue-500"></i> 헌혈</span>
              <i data-lucide="pin" class="w-3 h-3 text-gray-400 rotate-45"></i>
            </a>
            <a href="#" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="utensils" class="w-3.5 h-3.5 text-blue-500"></i> 나눔메뉴</span>
              <i data-lucide="pin" class="w-3 h-3 text-gray-400 rotate-45"></i>
            </a>
            <a href="#" class="flex items-center justify-between px-1.5 py-1 hover:bg-gray-200 rounded text-gray-700">
              <span class="flex items-center gap-2"><i data-lucide="footprints" class="w-3.5 h-3.5 text-blue-500"></i> 사랑의걷기</span>
              <i data-lucide="pin" class="w-3 h-3 text-gray-400 rotate-45"></i>
            </a>
          </div>
        </div>

        <!-- 내 PC / 네트워크 -->
        <div class="space-y-1">
          <a href="#" class="flex items-center gap-2 px-1.5 py-1 hover:bg-gray-200 rounded">
            <i data-lucide="hard-drive" class="w-3.5 h-3.5 text-blue-500"></i> 내 PC
          </a>
          <a href="#" class="flex items-center gap-2 px-1.5 py-1 hover:bg-gray-200 rounded">
            <i data-lucide="network" class="w-3.5 h-3.5 text-blue-500"></i> 네트워크
          </a>
        </div>
      </aside>

      <!-- 우측 메인 영역 (Main Content) -->
      <main id="mainContent" class="flex-1 bg-white p-4 overflow-y-auto flex flex-col gap-6">

        <!-- 자주 사용하는 폴더 -->
        <div>
          <div class="flex items-center gap-1 border-b border-gray-200 pb-1 mb-3 text-gray-700 font-medium">
            <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
            <span>주요 나눔 활동 카테고리</span>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            
            <div onclick="showVolunteerImages(event)" class="flex items-start gap-3 p-2 rounded hover:bg-blue-50 hover:border-blue-200 border border-transparent cursor-pointer group">
              <div class="relative">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400 fill-yellow-400"></i>
                <i data-lucide="hands-holding" class="w-4 h-4 text-blue-500 absolute bottom-1 right-1"></i>
              </div>
              <div class="flex flex-col">
                <span class="font-medium text-gray-800 group-hover:text-blue-600">자원봉사</span>
                <span class="text-[10px] text-gray-400 flex items-center gap-0.5">나눔가이드 <i data-lucide="pin" class="w-2.5 h-2.5 rotate-45"></i></span>
              </div>
            </div>

            <div class="flex items-start gap-3 p-2 rounded hover:bg-blue-50 hover:border-blue-200 border border-transparent cursor-pointer group">
              <div class="relative">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400 fill-yellow-400"></i>
                <i data-lucide="monitor" class="w-4 h-4 text-blue-500 absolute bottom-1 right-1"></i>
              </div>
              <div class="flex flex-col">
                <span class="font-medium text-gray-800 group-hover:text-blue-600">나눔키오스크</span>
                <span class="text-[10px] text-gray-400 flex items-center gap-0.5">나눔가이드 <i data-lucide="pin" class="w-2.5 h-2.5 rotate-45"></i></span>
              </div>
            </div>

            <div class="flex items-start gap-3 p-2 rounded hover:bg-blue-50 hover:border-blue-200 border border-transparent cursor-pointer group">
              <div class="relative">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400 fill-yellow-400"></i>
                <i data-lucide="heart-handshake" class="w-4 h-4 text-blue-500 absolute bottom-1 right-1"></i>
              </div>
              <div class="flex flex-col">
                <span class="font-medium text-gray-800 group-hover:text-blue-600">정기기부</span>
                <span class="text-[10px] text-gray-400 flex items-center gap-0.5">나눔가이드 <i data-lucide="pin" class="w-2.5 h-2.5 rotate-45"></i></span>
              </div>
            </div>

            <div class="flex items-start gap-3 p-2 rounded hover:bg-blue-50 hover:border-blue-200 border border-transparent cursor-pointer group">
              <div class="relative">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400 fill-yellow-400"></i>
                <i data-lucide="droplet" class="w-4 h-4 text-blue-500 absolute bottom-1 right-1"></i>
              </div>
              <div class="flex flex-col">
                <span class="font-medium text-gray-800 group-hover:text-blue-600">헌혈</span>
                <span class="text-[10px] text-gray-400 flex items-center gap-0.5">나눔가이드 <i data-lucide="pin" class="w-2.5 h-2.5 rotate-45"></i></span>
              </div>
            </div>

            <div class="flex items-start gap-3 p-2 rounded hover:bg-blue-50 hover:border-blue-200 border border-transparent cursor-pointer group">
              <div class="relative">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400 fill-yellow-400"></i>
                <i data-lucide="utensils" class="w-4 h-4 text-blue-500 absolute bottom-1 right-1"></i>
              </div>
              <div class="flex flex-col">
                <span class="font-medium text-gray-800 group-hover:text-blue-600">나눔메뉴</span>
                <span class="text-[10px] text-gray-400 flex items-center gap-0.5">나눔가이드 <i data-lucide="pin" class="w-2.5 h-2.5 rotate-45"></i></span>
              </div>
            </div>

            <div class="flex items-start gap-3 p-2 rounded hover:bg-blue-50 hover:border-blue-200 border border-transparent cursor-pointer group">
              <div class="relative">
                <i data-lucide="folder" class="w-10 h-10 text-yellow-400 fill-yellow-400"></i>
                <i data-lucide="footprints" class="w-4 h-4 text-blue-500 absolute bottom-1 right-1"></i>
              </div>
              <div class="flex flex-col">
                <span class="font-medium text-gray-800 group-hover:text-blue-600">사랑의걷기</span>
                <span class="text-[10px] text-gray-400 flex items-center gap-0.5">나눔가이드 <i data-lucide="pin" class="w-2.5 h-2.5 rotate-45"></i></span>
              </div>
            </div>

          </div>
        </div>

        <!-- 최근에 사용한 파일 (이미지 출력 영역) -->
        <div>
          <div class="flex items-center gap-1 border-b border-gray-200 pb-1 mb-3 text-gray-700 font-medium">
            <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
            <span>최근 게시물 및 안내 서식</span>
          </div>

          <div id="imageDisplayContainer" class="py-4 text-center text-gray-400 text-xs">
            신청 서식이나 최신 나눔 소식이 여기에 표시됩니다.
          </div>
        </div>

      </main>
    </div>

    <!-- 4. 하단 상태 표시줄 (Status Bar) -->
    <div class="bg-slate-50 border-t border-gray-200 px-3 py-1 flex justify-between items-center text-gray-500 text-[11px]">
      <div>7개 항목</div>
      <div class="flex items-center gap-2">
        <button class="p-1 hover:bg-gray-200 rounded text-gray-700"><i data-lucide="layout-grid" class="w-3.5 h-3.5"></i></button>
        <button class="p-1 hover:bg-gray-200 rounded text-gray-400"><i data-lucide="list" class="w-3.5 h-3.5"></i></button>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();

    function showVolunteerImages(event) {
      if (event) event.preventDefault();
      
      var container = document.getElementById('imageDisplayContainer');
      container.className = "flex flex-col gap-4 items-center w-full py-2";
      container.innerHTML = `
        <img src="Data/1.jpg" alt="자원봉사 가이드 1" class="w-full max-w-2xl h-auto rounded border border-gray-300 shadow-sm">
        <img src="Data/2.png" alt="자원봉사 가이드 2" class="w-full max-w-2xl h-auto rounded border border-gray-300 shadow-sm">
      `;

      var mainContent = document.getElementById('mainContent');
      mainContent.scrollTo({
        top: container.offsetTop - 20,
        behavior: 'smooth'
      });
    }
  </script>
</body>
</html>
