<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS Explorer Style Webpage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      user-select: none;
    }
    .window-box {
      position: absolute;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden relative font-sans">

  <!-- 1. 바탕화면 폴더 아이콘 -->
  <div class="p-8 flex flex-col gap-6 items-start">
    <div onclick="openWindow('folder1')" class="flex flex-col items-center gap-1 cursor-pointer group p-2 rounded hover:bg-white/10 transition">
      <div class="text-4xl">📁</div>
      <span class="text-xs text-gray-300 group-hover:text-white">PROJECTS</span>
    </div>

    <div onclick="openWindow('folder2')" class="flex flex-col items-center gap-1 cursor-pointer group p-2 rounded hover:bg-white/10 transition">
      <div class="text-4xl">🖼️</div>
      <span class="text-xs text-gray-300 group-hover:text-white">GALLERY</span>
    </div>
  </div>

  <!-- 2. 창 (Window 1: PROJECTS) -->
  <div id="folder1" class="window-box hidden w-80 sm:w-96 bg-gray-900 border border-gray-700 rounded-lg overflow-hidden top-20 left-24">
    <!-- 창 상단바 (드래그 영역) -->
    <div class="window-header bg-gray-800 px-4 py-2 border-b border-gray-700 flex justify-between items-center cursor-move">
      <span class="text-xs font-mono text-gray-300">C:/PROJECTS</span>
      <div class="flex gap-1.5">
        <button onclick="closeWindow('folder1')" class="w-3 h-3 rounded-full bg-red-500 hover:bg-red-600"></button>
        <button onclick="closeWindow('folder1')" class="w-3 h-3 rounded-full bg-yellow-500 hover:bg-yellow-600"></button>
        <button onclick="closeWindow('folder1')" class="w-3 h-3 rounded-full bg-green-500 hover:bg-green-600"></button>
      </div>
    </div>
    <!-- 창 본문 -->
    <div class="p-4 text-sm text-gray-300 max-h-60 overflow-y-auto space-y-2">
      <p class="font-bold text-white">📁 프로젝트 목록</p>
      <ul class="list-disc list-inside text-xs space-y-1 text-gray-400">
        <li>Project_A_2026.pdf</li>
        <li>Design_System_v2.fig</li>
        <li>Client_Presentation.ppt</li>
      </ul>
    </div>
  </div>

  <!-- 3. 창 (Window 2: GALLERY) -->
  <div id="folder2" class="window-box hidden w-80 sm:w-96 bg-gray-900 border border-gray-700 rounded-lg overflow-hidden top-36 left-48">
    <!-- 창 상단바 (드래그 영역) -->
    <div class="window-header bg-gray-800 px-4 py-2 border-b border-gray-700 flex justify-between items-center cursor-move">
      <span class="text-xs font-mono text-gray-300">C:/GALLERY</span>
      <div class="flex gap-1.5">
        <button onclick="closeWindow('folder2')" class="w-3 h-3 rounded-full bg-red-500 hover:bg-red-600"></button>
        <button onclick="closeWindow('folder2')" class="w-3 h-3 rounded-full bg-yellow-500 hover:bg-yellow-600"></button>
        <button onclick="closeWindow('folder2')" class="w-3 h-3 rounded-full bg-green-500 hover:bg-green-600"></button>
      </div>
    </div>
    <!-- 창 본문 -->
    <div class="p-4 text-sm text-gray-300 max-h-60 overflow-y-auto">
      <div class="grid grid-cols-2 gap-2">
        <div class="bg-gray-800 h-20 rounded flex items-center justify-center text-xs text-gray-500">IMG_01.jpg</div>
        <div class="bg-gray-800 h-20 rounded flex items-center justify-center text-xs text-gray-500">IMG_02.jpg</div>
      </div>
    </div>
  </div>

  <!-- 드래그 & 창 열기/닫기 스크립트 -->
  <script>
    let highestZIndex = 10;

    function openWindow(id) {
      const win = document.getElementById(id);
      win.classList.remove('hidden');
      bringToFront(win);
    }

    function closeWindow(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function bringToFront(element) {
      highestZIndex++;
      element.style.zIndex = highestZIndex;
    }

    // 창 드래그 기능 구현
    document.querySelectorAll('.window-box').forEach(win => {
      const header = win.querySelector('.window-header');
      let isDragging = false;
      let offsetX, offsetY;

      win.addEventListener('mousedown', () => bringToFront(win));

      header.addEventListener('mousedown', (e) => {
        isDragging = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        win.style.left = `${e.clientX - offsetX}px`;
        win.style.top = `${e.clientY - offsetY}px`;
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });
    });
  </script>
</body>
</html>
